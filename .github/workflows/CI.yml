name: .NET

on:
  push:
    branches: [ "lama" ]
  pull_request:
    branches: [ "lama" ]

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      test_projects: ${{ steps.discover.outputs.test_projects }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Discover test projects
        id: discover
        run: |
          TEST_PROJECTS=$(find . -type f -name "*Test.csproj" | jq -R -s -c 'split("\n")[:-1]')
          echo "Discovered test projects: $TEST_PROJECTS"
          echo "test_projects=$TEST_PROJECTS" >> $GITHUB_OUTPUT

  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        test_project: ${{ fromJson(needs.build.outputs.test_projects) }}
    env:
      ASPNETCORE_ENVIRONMENT: Test

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests for ${{ matrix.test_project }}
        run: |
          echo "🧪 Running tests for ${{ matrix.test_project }}"
          dotnet test "${{ matrix.test_project }}" \
            --configuration Release \
            --no-restore \
            --no-build \
            --logger "trx;LogFileName=$(basename ${{ matrix.test_project }}).trx" \
            --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: '**/coverage.cobertura.xml'
