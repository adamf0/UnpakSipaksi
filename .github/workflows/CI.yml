name: .NET CI + Coverage Report

on:
  push:
    branches: [ "lama" ]
  pull_request:
    branches: [ "lama" ]

permissions:
  contents: write  # diperlukan untuk push ke gh-pages

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ===============================
      # 1️⃣ Checkout Repository
      # ===============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===============================
      # 2️⃣ Setup .NET
      # ===============================
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # ===============================
      # 3️⃣ Restore Dependencies
      # ===============================
      - name: Restore dependencies
        run: dotnet restore

      # ===============================
      # 4️⃣ Build Solution
      # ===============================
      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      # ===============================
      # 5️⃣ Run Tests + Collect Coverage
      # ===============================
      - name: Run all tests and collect coverage
        env:
          ASPNETCORE_ENVIRONMENT: Test
        run: |
          mkdir -p TestResults
          for proj in $(find . -type f -name "*Test.csproj"); do
            echo "🧪 Running tests for $proj"
            dotnet test "$proj" \
              --configuration Release \
              --no-restore \
              --no-build \
              --collect:"XPlat Code Coverage" \
              --results-directory "TestResults"
          done

      # ===============================
      # 6️⃣ Generate HTML Coverage Report
      # ===============================
      - name: Generate HTML coverage report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          export PATH="$PATH:~/.dotnet/tools"
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:Html

      # ===============================
      # 7️⃣ Upload Coverage as Artifact (optional)
      # ===============================
      - name: Upload HTML report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: CoverageReport

  # ===============================
  # 8️⃣ Deploy to GitHub Pages
  # ===============================
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: html-coverage-report
          path: CoverageReport

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./CoverageReport
