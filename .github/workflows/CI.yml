name: .NET CI + Coverage Report

on:
  push:
    branches: [ "lama" ]
  pull_request:
    branches: [ "lama" ]

permissions:
  contents: write

jobs:
  # ====================================
  # 🔧 Build job (1x)
  # ====================================
  build:
    runs-on: ubuntu-latest

    outputs:
      build-artifact: ${{ steps.build-output.outputs.build-path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        id: build-output
        run: |
          dotnet build --configuration Release --no-restore
          echo "build-path=$(pwd)" >> $GITHUB_OUTPUT

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .
          retention-days: 1

  # ====================================
  # 🧪 Test Domain (sequential)
  # ====================================
  test-domain:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.build.outputs.build-artifact) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Find Domain test projects
        id: find-tests
        run: |
          echo "projects=$(find . -type f -path '*/DomainTest/*Test.csproj' | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT

      - name: Run Domain Tests (Sequential with coverage)
        run: |
          mkdir -p TestResults
          for proj in $(find . -type f -path '*/DomainTest/*Test.csproj'); do
            echo "🧪 Running DOMAIN test: $proj"
            dotnet test "$proj" \
              --configuration Release \
              --no-build \
              --logger "trx;LogFileName=TestResults/domain-$(basename "$proj").trx" \
              --results-directory "TestResults" \
              --collect:"XPlat Code Coverage" || true
          done
        env:
          ASPNETCORE_ENVIRONMENT: Test

      - name: Upload Domain test results
        uses: actions/upload-artifact@v4
        with:
          name: domain-test-results
          path: TestResults

  # ====================================
  # ⚙️ Test Application (parallel per project)
  # ====================================
  test-application:
    needs: [build, test-domain]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(steps.find-tests.outputs.projects) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run Application Test (${{ matrix.project }})
        run: |
          mkdir -p TestResults
          echo "🧪 Running APP test: ${{ matrix.project }}"
          dotnet test "${{ matrix.project }}" \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=TestResults/app-$(basename '${{ matrix.project }}').trx" \
            --results-directory "TestResults" \
            --collect:"XPlat Code Coverage" || true
        env:
          ASPNETCORE_ENVIRONMENT: Test

      - name: Upload Application test results
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results-${{ matrix.project }}
          path: TestResults

  # ====================================
  # 📊 Combine Coverage and Generate HTML
  # ====================================
  coverage:
    needs: [test-domain, test-application]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: TestResults

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage HTML report
        run: |
          export PATH="$PATH:~/.dotnet/tools"
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:Html

      - name: Upload HTML Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: CoverageReport

  # ====================================
  # 🚀 Deploy Coverage to GitHub Pages
  # ====================================
  deploy:
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: html-coverage-report
          path: CoverageReport

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./CoverageReport
