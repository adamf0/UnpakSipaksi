name: .NET CI + Coverage Report

on:
  push:
    branches: [ "lama" ]
  pull_request:
    branches: [ "lama" ]

permissions:
  contents: write

jobs:
  # ====================================
  # 1️⃣ Build
  # ====================================
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build solution
        run: dotnet build --configuration Release --no-restore
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .
          retention-days: 1

  # ====================================
  # 2️⃣ Find test projects (output ke JSON)
  # ====================================
  find-tests:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      domain: ${{ steps.domain.outputs.list }}
      application: ${{ steps.application.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - name: Find Domain test projects
        id: domain
        run: |
          DOMAIN=$(find . -type f -path "*/DomainTest/*Test.csproj" | jq -R -s -c 'split("\n")[:-1]')
          echo "list=$DOMAIN" >> $GITHUB_OUTPUT

      - name: Find Application test projects
        id: application
        run: |
          APP=$(find . -type f -path "*/ApplicationTest/*Test.csproj" | jq -R -s -c 'split("\n")[:-1]')
          echo "list=$APP" >> $GITHUB_OUTPUT

  # ====================================
  # 3️⃣ Domain Tests (Parallel per project)
  # ====================================
  test-domain:
    needs: [build, find-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.find-tests.outputs.domain) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Run Domain Test (${{ matrix.project }})
        run: |
          mkdir -p TestResults
          echo "🧪 Running DOMAIN test: ${{ matrix.project }}"
          dotnet test "${{ matrix.project }}" \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=TestResults/domain-$(basename '${{ matrix.project }}').trx" \
            --results-directory "TestResults" \
            --collect:"XPlat Code Coverage" || true
        env:
          ASPNETCORE_ENVIRONMENT: Test
      - uses: actions/upload-artifact@v4
        with:
          name: domain-test-results-${{ matrix.project }}
          path: TestResults

  # ====================================
  # 4️⃣ Application Tests (Parallel per project, setelah domain selesai)
  # ====================================
  test-application:
    needs: [test-domain, find-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.find-tests.outputs.application) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Run Application Test (${{ matrix.project }})
        run: |
          mkdir -p TestResults
          echo "🧪 Running APP test: ${{ matrix.project }}"
          dotnet test "${{ matrix.project }}" \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=TestResults/app-$(basename '${{ matrix.project }}').trx" \
            --results-directory "TestResults" \
            --collect:"XPlat Code Coverage" || true
        env:
          ASPNETCORE_ENVIRONMENT: Test
      - uses: actions/upload-artifact@v4
        with:
          name: app-test-results-${{ matrix.project }}
          path: TestResults

  # ====================================
  # 5️⃣ Combine Coverage + Generate HTML
  # ====================================
  coverage:
    needs: [test-domain, test-application]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: TestResults
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
      - name: Generate coverage HTML report
        run: |
          export PATH="$PATH:~/.dotnet/tools"
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:Html
      - uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: CoverageReport

  # ====================================
  # 6️⃣ Deploy to GitHub Pages
  # ====================================
  deploy:
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: html-coverage-report
          path: CoverageReport
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./CoverageReport
